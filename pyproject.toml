[project]
name = "FinPilotAPI"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "kyvotdev", email = "kofisupp@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "authx>=1.7.1",
    "fastapi[standard]>=0.165.0",
    "greenlet>=3.5.6",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
api = "finapi:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "backend"
module-root = "src"

[tool.ruff]
# A python version in a project
target-version = "py314"

# Max lenght of line
line-length = 88

# Spaces
indent-width = 4


[tool.ruff.lint]
select = [
    "E4",    # Import formatting errors
    "E7",    # Statement errors
    "E9",    # Runtime errors
    "F",     # Pyflakes: logical errors and unused code
    "I",     # Import sorting (isort)
    "B",     # Likely bugs and design problems
    "UP",    # Python syntax upgrades
    "SIM",   # Code simplification
    "ASYNC", # Async-related issues
    "RUF",   # Ruff-specific rules
]

ignore = [
    "E501",  # Line length is handled by the formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true
